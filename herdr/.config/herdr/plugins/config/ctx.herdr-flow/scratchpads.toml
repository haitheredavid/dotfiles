# Popup size for the scratchpad picker (cells or "N%").
width = "80%"
height = "80%"

[[scratchpad]]
name = "shell"            # login $SHELL in the focused pane's cwd

[[scratchpad]]
name = "notes"
command = "hx ~/scratch.md"
cwd = "~"

