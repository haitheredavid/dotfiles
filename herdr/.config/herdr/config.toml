onboarding = false
[keys]
# Mirrors ~/.tmux.conf.
prefix = "ctrl+a"

# Splits: = side by side, - stacked (tmux split-window -h / -v).
split_vertical = "prefix+="
split_horizontal = "prefix+minus"

# Resize with shifted vim keys (tmux H/J/K/L); swap moves to ctrl+h/j/k/l.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

# tmux: r reloads config, R resizes.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: , renames the window (pane here), . for the workspace, ' for the tab.
rename_pane = "prefix+,"
rename_workspace = "prefix+."
rename_tab = "prefix+'"

# Close tab on W; free because rename_workspace moved off its default prefix+shift+w.
close_tab = "prefix+shift+w"

# Workspaces (tmux sessions): direct ctrl+alt chords, no prefix. Ghostty leaves ctrl+alt free.
# prefix+9/0 (tmux switch-client -p/-n) would collide with switch_tab's prefix+9.
previous_workspace = "ctrl+alt+p"
next_workspace = "ctrl+alt+n"
switch_workspace = "ctrl+alt+1..9"

# Workspace navigator (prefix+w): j/k walk workspaces instead of arrows; pane moves take shift+j/k.
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "shift+j"
navigate_pane_up = "shift+k"

# Pane layouts via the ctx.herdr-flow plugin (~/projects/ctx-herdr). tmux uses prefix Tab/BTab
# for next/previous-layout, but herdr's prefix+tab cycles panes, so layouts go on prefix+space.
# Cycle: even-horizontal, even-vertical, main-horizontal, main-vertical, tiled.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "ctx.herdr-flow.layout-next"
description = "next pane layout"

[[keys.command]]
key = "prefix+alt+space"
type = "plugin_action"
command = "ctx.herdr-flow.layout-prev"
description = "previous pane layout"

# tmux rotate-window (prefix C-o): every pane moves one slot forward, shape kept.
[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "ctx.herdr-flow.layout-rotate"
description = "rotate panes"

# Popup scratchpads (ctx.herdr-flow, zmx-backed). ctrl+\ inside hides; prefix+t reopens.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "ctx.herdr-flow.scratch"
description = "scratchpads"

# Jump to the parent of the focused worktree workspace (the repo's source checkout).
# herdr has no pinning or parent-jump action; worktree list reports the group's source workspace.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = '''id=$(/opt/homebrew/bin/herdr worktree list | grep -o '"source_workspace_id":"[^"]*"' | cut -d'"' -f4) && [ -n "$id" ] && /opt/homebrew/bin/herdr workspace focus "$id"'''
description = "jump to worktree parent"

# New tab running helix in the workspace's root directory (ctx.herdr-flow).
[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "ctx.herdr-flow.editor"
description = "helix tab at workspace root"

# Agent critters (ctx.herdr-flow): alt+a pins a narrow split, alt+shift+a pops it over the layout.
[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "ctx.herdr-flow.critters"
description = "agent critters (split)"

[[keys.command]]
key = "prefix+alt+shift+a"
type = "plugin_action"
command = "ctx.herdr-flow.critters-popup"
description = "agent critters (popup)"

# Construction town (ctx.herdr-flow): alt+c opens the city as a split beside the focused pane, alt+shift+c as a popup.
[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "ctx.herdr-flow.town"
description = "construction town (split)"

[[keys.command]]
key = "prefix+alt+shift+c"
type = "plugin_action"
command = "ctx.herdr-flow.town-popup"
description = "construction town (popup)"

# panoptes plugin (prefix+o is herdr's default open_notification_target).
[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "panoptes.open"
description = "panoptes (overlay)"

[[keys.command]]
key = "prefix+alt+shift+o"
type = "plugin_action"
command = "panoptes.open-tab"
description = "panoptes (new tab)"

# herdr-bar: Cmd+K-style fuzzy jump to any tab/pane/agent. prefix+k is focus_pane_up, so the
# prefix chord is alt+k; ctrl+alt+k is the direct chord a terminal can map Cmd+K onto.
[[keys.command]]
key = ["prefix+alt+k", "ctrl+alt+k"]
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# sessionizer (tmux-sessionizer for workspaces): f opens a project, F a git worktree, alt+f closes.
# Roots/layout: ~/.config/herdr/plugins/config/sessionizer/config.toml.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "sessionizer.close"
description = "close or remove workspaces"

# herdr-ohmyzsh: `omz reload` in every idle zsh pane (upstream suggests prefix+shift+r, taken by resize_mode).
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "ohmyzsh.shell.reload-all"
description = "reload Oh My Zsh in idle panes"

# dark-tundra, matching ~/.tmux.conf and omp. Palette:
#   iceCave #11171C  glacierBlue #172028  permafrost #1E2A34  coldBorder #2A3A46
#   iceWhite #E3E9F0  mutedIce #A3B0BF  dimIce #667381  emberOrange #D9773A (accent)
#   successGreen #5FB487  warningGold #D0B04D  errorRed #D26B6B
[theme]
name = "catppuccin"
auto_switch = false

# Backgrounds stay transparent (like tmux bg=default) so Ghostty opacity shows through.
[theme.custom]
panel_bg = "reset"
active_row_bg = "#172028"
selection_bg = "#2A3A46"
accent = "#D9773A"
surface_dim = "#11171C"
surface0 = "#1E2A34"
surface1 = "#2A3A46"
overlay0 = "#667381"
overlay1 = "#A3B0BF"
text = "#E3E9F0"
subtext0 = "#A3B0BF"
green = "#5FB487"
teal = "#66D1A1"
yellow = "#D0B04D"
peach = "#E4CB75"
red = "#D26B6B"
blue = "#6C9FD6"
mauve = "#B08FD2"

[ui]
# tmux-style internal splitters, pane labels on borders.
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
# tmux status-right: load | git branch | clock.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "printf 'load %s' \"$(~/.tmux/load.sh)\"", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "~/.tmux/git-branch.sh \"$PWD\"", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " | "
# Distinct glyphs per state (blocked/working/done/idle), so rows don't need state text.
status_indicators = "symbols"

# Agents list, one line each: state glyph + what it's doing (omp puts its session title in the
# terminal title). Location is implicit: agent_panel_sort = "spaces" groups rows by workspace.
[ui.sidebar.agents]
rows = [["state_icon", { token = "terminal_title_stripped", fg = "#E3E9F0" }]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"
