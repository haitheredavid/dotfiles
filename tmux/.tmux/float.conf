# Config for the "float" tmux server behind the C-8 / C-9 / C-0 popups (~/.tmux/float.sh).
# Same keys, copy mode and theme as the main server; the popup draws the outer border, so the
# status bar goes and the pane border just names the panel.
source-file ~/.tmux.conf
set -g status off
set -g pane-border-format " #[fg=#D9773A,bold]#S #[fg=#667381,nobold]C-8 note  C-9 omp  C-0 term  (same key hides) #[default]"

# Same key as the open panel hides it (detaches the popup; the session keeps running).
# Another panel key switches this popup to that panel, creating it if needed in the directory
# of the main pane the popup was opened from.
bind-key -n C-8 if -F '#{==:#{session_name},scratch}' detach-client { run-shell '~/.tmux/float.sh ensure scratch "#{@float_origin}"' ; switch-client -t =scratch }
bind-key -n C-9 if -F '#{==:#{session_name},omp}'     detach-client { run-shell '~/.tmux/float.sh ensure omp "#{@float_origin}"'     ; switch-client -t =omp }
bind-key -n C-0 if -F '#{==:#{session_name},term}'    detach-client { run-shell '~/.tmux/float.sh ensure term "#{@float_origin}"'    ; switch-client -t =term }

# prefix+r in the main config would reload ~/.tmux.conf alone and drop the overrides above.
bind-key r source-file ~/.tmux/float.conf \; display-message "Float config reloaded"
