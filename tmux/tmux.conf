set -g mouse on
set -g history-limit 10000
set -g focus-events on

# Pi: preserve modified Enter keys inside tmux (Shift+Enter, Ctrl+Enter, Alt+Enter).
# pi.dev/docs/latest/tmux recommends CSI-u extended keys for reliable keybinding detection.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-256color:hyperlinks:extkeys'
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',xterm-ghostty:hyperlinks:RGB'

# Truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

set -g allow-passthrough on

# Mouse selection should copy without exiting copy-mode. tmux's default
# copy-pipe-and-cancel jumps back to the live prompt after selection.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind-key -T root DoubleClick1Pane          select-pane -t = \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind-key -T root TripleClick1Pane          select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear

# don't rename windows automatically
set-option -g allow-rename off
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key R command-prompt -p "Pane width (%)" "resize-pane -x %1%"
set -s command-alias[100] rsx='resize-pane -x'
set -s command-alias[101] rsy='resize-pane -y'

# Split panes
unbind '"'
unbind %

# Session switch: 9 prev, 0 next
unbind '('
unbind ')'
bind-key 9 switch-client -p
bind-key 0 switch-client -n
bind-key = split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Navigate panes with vim direction keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Equalize current pane + siblings along their axis (keeps nested splits)
bind-key e select-layout -E

# Resize panes with shifted vim keys (repeatable)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Rename pane (window rename is prefix+, built-in)
bind-key , command-prompt -p "Window name:" "rename-window '%%'"
bind-key . command-prompt -p "Pane name:" "select-pane -T '%%'"

# Promote current window into its own new session
bind-key W command-prompt -p "Send window to new session:" {
  new-session -d -s "%%"
  move-window -t "%%:"
  kill-window -t "%%:^"
}

# --- Simple display: windows + panes ---
# Windows in status bar
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left


# Pane index on border + longer display-panes
set -g pane-border-status top
set -g pane-border-format " #[fg=#576a7d]  #P  #{?pane_title,#{pane_title},#{pane_current_command}} #[default]"
set -g display-panes-time 2000
set -g display-panes-colour "#576a7d"
set -g display-panes-active-colour "#ef6462"

# --- TPM (no theme plugin; Frantic Contrast styles are set explicitly below) ---
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

# --- Frantic Contrast (rainglow) theme — ported from VS Code ---
# Dim inactive panes by FG only. Any explicit bg= paints the cell opaque and blocks
# Ghostty's background-opacity + toggle_background_opacity from showing through.
set -g window-active-style 'fg=#aeb9c4,bg=default'
set -g window-style        'fg=#909fae,bg=default'   # dimmed fg, transparent

# Status bar must also stay bg=default or it renders as a solid strip.
# Accent chips in status-left/window-status-current keep their own bg on purpose.
set -g status-style 'bg=default,fg=#aeb9c4'

# prefix+B: trade transparency for stronger bg-based inactive-pane dimming
set -g @transparent 1
bind-key B if -F '#{@transparent}' \
  "set -g @transparent 0 ; set -g window-style 'fg=#909fae,bg=#060708' ; set -g status-style 'bg=#181e23,fg=#aeb9c4' ; display-message 'opaque: bg dimming on'" \
  "set -g @transparent 1 ; set -g window-style 'fg=#909fae,bg=default'  ; set -g status-style 'bg=default,fg=#aeb9c4'  ; display-message 'transparent: follows Ghostty'"

# Borders + misc accents
set -g pane-border-style        'fg=#2d3741'
set -g pane-active-border-style 'fg=#ef6462,bold'    # theme focusBorder coral
set -g pane-border-lines heavy
set -g message-style         'bg=#232a32,fg=#aeb9c4,bold'
set -g message-command-style 'bg=#232a32,fg=#89a7bc'
set -g mode-style    'bg=#ef6462,fg=#ffffff'         # selection: coral / white
set -g clock-mode-colour '#89a7bc'

# Window list (previously provided by tmux-gruvbox)
set -g window-status-separator ''
set -g window-status-style          'bg=default,fg=#62778c'
set -g window-status-current-style  'bg=default'
set -g window-status-activity-style 'bg=default,fg=#f7b83d'
set -g window-status-bell-style     'bg=#e61f44,fg=#ffffff'
set -g window-status-format         ' #[fg=#62778c]#I #W#{?window_zoomed_flag, Z,} '
set -g window-status-current-format '#[bg=#89a7bc,fg=#0e1114,bold] #I #W#{?window_zoomed_flag, Z,} #[default]'

# Status content: session name, load, git branch, clock
set -g status-left  "#[bg=#ef6462,fg=#ffffff,bold]   #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#909fae]   #(~/.tmux/load.sh)  ·  #(~/.tmux/git-branch.sh #{pane_current_path})  ·    %H:%M "
set -g status-right-length 80
