modelRoles:
  default: claude-bridge/claude-opus-5-5
  plan: claude-bridge/claude-opus-5-5:high
  review: claude-bridge/claude-opus-5-5:high
task:
  agentModelOverrides:
    reviewer: "@review"
symbolPreset: ascii
composer:
  shape: box
theme:
  light: dark-tundra-ember
  dark: dark-tundra-ember-contrast
setupVersion: 3
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: false
  subagentLivePreview: false
  hideToolActivity: true
extensionRenderers:
  assistantText: true
statusLine:
  preset: custom
  leftSegments:
    - model
    - time_spent
    - cache_hit
    - path
    - git
  rightSegments:
    - status
  separator: pipe
  transparent: true
  contextLine: percentage
  showHookStatus: false
  sessionAccent: false
tui:
  autoGraph: smart
  tight: false
  vimMode: true
  vimModeDisplay: text
  resizeScrollback: preserve
advisor:
  enabled: false
  maxNotesPerUpdate: 2
steeringMode: all
tools:
  approvalMode: yolo
vault:
  enabled: true
dev:
  autoqaConsent: granted
hideThinkingBlock: true
recap:
  enabled: false
personality: pragmatic
compaction:
  handoffSaveToDisk: false
bash:
  allowCompoundCommands: true
proseOnlyThinking: true
includeModelInPrompt: false
followUpMode: one-at-a-time
collab:
  displayName: dmo
defaultThinkingLevel: medium
claudeResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
startup:
  quiet: true
update:
  auto: true