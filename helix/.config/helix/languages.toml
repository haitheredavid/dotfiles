# ---------------------------------------------------------------------------
# Lua / LÖVE — lua-language-server.
# LÖVE globals + API defs come from the project .luarc.json (auto-read from
# the workspace root). Keep a .luarc.json per LÖVE project; see rg40xxv-game.
# ---------------------------------------------------------------------------
[language-server.lua-language-server]
command = "lua-language-server"

[[language]]
name = "lua"
language-servers = ["lua-language-server"]
# Walk up to these to find the workspace root (so .luarc.json is found).
roots = [".luarc.json", "main.lua", "conf.lua", ".git"]
indent = { tab-width = 4, unit = "    " }

# ---------------------------------------------------------------------------
# Markdown / MDX
# ---------------------------------------------------------------------------
# marksman handles plain markdown — Helix wires it by default once installed
# (brew install marksman), no [[language]] override needed.

# mdx-language-server (@mdx-js/language-server, installed via bun) — Volar-based,
# needs a TypeScript SDK path to power JSX/ESM intelligence inside .mdx files.
[language-server.mdx-language-server]
command = "mdx-language-server"
args = ["--stdio"]

[language-server.mdx-language-server.config]
typescript = { enabled = true, tsdk = "/Users/david/.bun/install/global/node_modules/typescript/lib" }

# Helix has no built-in mdx language — define one reusing the markdown grammar
# for highlighting.
[[language]]
name = "mdx"
scope = "source.mdx"
injection-regex = "mdx"
file-types = ["mdx"]
grammar = "markdown"
language-servers = ["mdx-language-server"]
roots = ["package.json", "tsconfig.json", ".git"]
block-comment-tokens = { start = "{/*", end = "*/}" }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "hcl"
language-servers = ["terraform-ls"]
auto-format = true
formatter = { command = "terraform", args = ["fmt", "-"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "tfvars"
language-servers = ["terraform-ls"]
auto-format = true
formatter = { command = "terraform", args = ["fmt", "-"] }
indent = { tab-width = 2, unit = "  " }
