theme = "dark_tundra_transparent"

# Chrome mirrors ~/.tmux.conf / omp status line: flat coloured text, `|` separators.
[editor]
bufferline = "multiple"
color-modes = true
popup-border = "all"

[editor.statusline]
separator = "|"
left = ["mode", "separator", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["spinner", "diagnostics", "separator", "spacer", "version-control", "spacer", "separator", "selections", "register", "position", "separator", "file-type"]

[editor.statusline.mode]
normal = "normal"
insert = "insert"
select = "select"

[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false

[keys.normal.space]
# Space+m: review current file in markless on helix's own terminal (q returns to helix)
m = [
  # :insert-output blocks helix while markless runs (:sh does not); all output goes to the tty so nothing is inserted.
  # Real tty device, not /dev/tty: crossterm's macOS input reader can't poll the /dev/tty alias.
  # Clear first (markless only paints non-blank cells), then restore what markless resets on exit:
  # alternate screen, bracketed paste, mouse capture.
  ':insert-output t=/dev/$(ps -o tty= -p $$ | tr -d " "); printf "\033[2J" > $t; markless "%{buffer_name}" < $t > $t 2>&1; printf "\033[?1049h\033[?2004h\033[?1000h\033[?1002h\033[?1003h\033[?1015h\033[?1006h" > $t',
  ':redraw',
]

[keys.normal]
# Press Ctrl+y to open Yazi
C-y = [
  # 1. Clear any previous selection
  ':sh rm -f /tmp/unique-file',
  # 2. Launch Yazi, passing current buffer context and saving selection to temp file
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  # 3. Restore terminal state (alternate screen + bracketed paste)
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  # 4. Open the selected file
  ':open %sh{cat /tmp/unique-file}',
  # 5. Refresh the editor display
  ':redraw',
]
